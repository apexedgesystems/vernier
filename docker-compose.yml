# Common dev shell configuration
x-common: &common
  working_dir: /home/${USER}/workspace
  volumes:
    - .:/home/${USER}/workspace:cached
    # CCACHE_HOST overrides the default named-volume mount with a bind
    # mount, so the host directory can be saved/restored across CI runs
    # (see .github/workflows/ci.yml). Unset locally -> named volume.
    - ${CCACHE_HOST:-ccache}:/ccache
    - ~/.gitconfig:/home/${USER}/.gitconfig:ro
    - ~/.ssh:/home/${USER}/.ssh:ro
  tty: true
  stdin_open: true

# Common build arguments
x-build-args: &build-args
  USER: ${USER}
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}
  HOST_KERNEL: ${HOST_KERNEL:-}
  VERSION: ${PROJECT_VERSION:-1.0.0}

services:
  # ============================================================================
  # Base images (build-only, not meant to be run directly)
  # ============================================================================
  # build-base: the lean compile/link/test tier (no dev tooling). The release
  # builders and the build-test gate can inherit only this; it also carries the
  # baked hermetic dependency caches that dev-base (vernier.base) inherits.
  build-base:
    image: vernier.build-base
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: build-base
      args:
        <<: *build-args
    profiles: ["build-only"]

  # base: the full dev tier (build-base + scanners/formatters/profilers/docs).
  base:
    image: vernier.base
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: dev-base
      args:
        <<: *build-args
    profiles: ["build-only"]

  # ============================================================================
  # Toolchain images (build-only layers)
  # ============================================================================
  toolchain-aarch64:
    image: vernier.toolchain.aarch64
    build:
      context: .
      dockerfile: docker/toolchain/aarch64.Dockerfile
      args:
        <<: *build-args
    profiles: ["build-only"]

  toolchain-rpi:
    image: vernier.toolchain.rpi
    build:
      context: .
      dockerfile: docker/toolchain/rpi.Dockerfile
      args:
        <<: *build-args
    profiles: ["build-only"]

  toolchain-riscv64:
    image: vernier.toolchain.riscv64
    build:
      context: .
      dockerfile: docker/toolchain/riscv64.Dockerfile
      args:
        <<: *build-args
    profiles: ["build-only"]

  # ============================================================================
  # Interactive development shells - Primary
  # ============================================================================
  dev:
    <<: *common
    image: vernier.dev.cpu
    build:
      context: .
      dockerfile: docker/dev/cpu.Dockerfile
      args:
        <<: *build-args
    hostname: vernier-dev-cpu
    privileged: true
    command: bash

  dev-cuda:
    <<: *common
    image: vernier.dev.cuda
    build:
      context: .
      dockerfile: docker/dev/cuda.Dockerfile
      args:
        <<: *build-args
    hostname: vernier-dev-cuda
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: bash

  # ============================================================================
  # Interactive development shells - Cross-compilation
  # ============================================================================
  dev-jetson:
    <<: *common
    image: vernier.dev.jetson
    build:
      context: .
      dockerfile: docker/dev/jetson.Dockerfile
      args:
        <<: *build-args
    hostname: vernier-dev-jetson
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash

  dev-rpi:
    <<: *common
    image: vernier.dev.rpi
    build:
      context: .
      dockerfile: docker/dev/rpi.Dockerfile
      args:
        <<: *build-args
    hostname: vernier-dev-rpi
    privileged: true
    command: bash

  dev-riscv64:
    <<: *common
    image: vernier.dev.riscv64
    build:
      context: .
      dockerfile: docker/dev/riscv64.Dockerfile
      args:
        <<: *build-args
    hostname: vernier-dev-riscv64
    privileged: true
    command: bash

  # ============================================================================
  # Lean release-builder tiers (build-only)
  # ============================================================================
  # The platform leaves built on build-base (not dev-base), so the release
  # builders carry the compile/link/test toolchain and the baked hermetic caches
  # but none of the dev-only scanners/profilers/formatters. The builder-* images
  # below derive from these.
  build-cpu:
    image: vernier.build.cpu
    build:
      context: .
      dockerfile: docker/dev/cpu.Dockerfile
      args:
        <<: *build-args
        BASE: vernier.build-base:latest
    profiles: ["build-only"]

  build-cuda:
    image: vernier.build.cuda
    build:
      context: .
      dockerfile: docker/dev/cuda.Dockerfile
      args:
        <<: *build-args
        OVERLAY: vernier.build-base:latest
        WITH_NSIGHT: "0"
        # The overlay loses ENV; re-activate the baked caches so this tier's
        # tools build offline like the rest of the build tiers.
        RUST_OFFLINE: "1"
        PIP_WHEELHOUSE: /opt/vernier-pip-wheels
    profiles: ["build-only"]

  build-rpi:
    image: vernier.build.rpi
    build:
      context: .
      dockerfile: docker/dev/rpi.Dockerfile
      args:
        <<: *build-args
        BASE: vernier.build.cpu:latest
    profiles: ["build-only"]

  build-riscv64:
    image: vernier.build.riscv64
    build:
      context: .
      dockerfile: docker/dev/riscv64.Dockerfile
      args:
        <<: *build-args
        BASE: vernier.build.cpu:latest
    profiles: ["build-only"]

  build-jetson:
    image: vernier.build.jetson
    build:
      context: .
      dockerfile: docker/dev/jetson.Dockerfile
      args:
        <<: *build-args
        BASE: vernier.build.cuda:latest
    profiles: ["build-only"]

  # ============================================================================
  # Builder images (CI artifact generation)
  # ============================================================================
  builder-cpu:
    image: vernier.builder.cpu
    build:
      context: .
      dockerfile: docker/builder/cpu.Dockerfile
      args:
        <<: *build-args

  builder-cuda:
    image: vernier.builder.cuda
    build:
      context: .
      dockerfile: docker/builder/cuda.Dockerfile
      args:
        <<: *build-args
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  builder-jetson:
    image: vernier.builder.jetson
    build:
      context: .
      dockerfile: docker/builder/jetson.Dockerfile
      args:
        <<: *build-args

  builder-rpi:
    image: vernier.builder.rpi
    build:
      context: .
      dockerfile: docker/builder/rpi.Dockerfile
      args:
        <<: *build-args

  builder-riscv64:
    image: vernier.builder.riscv64
    build:
      context: .
      dockerfile: docker/builder/riscv64.Dockerfile
      args:
        <<: *build-args

  # ============================================================================
  # Final image (artifact packaging)
  # ============================================================================
  final:
    image: vernier.final
    build:
      context: .
      dockerfile: docker/final.Dockerfile
      args:
        <<: *build-args
    profiles: ["build-only"]

volumes:
  ccache:
    name: vernier-ccache
