# ==============================================================================
# Docker Images -- Build and push dev images to ghcr.io
#
# Dev and base images are infrastructure: they change only when a Dockerfile
# changes (toolchain version bump, new SDK, new system package). This workflow
# builds and caches them so CI and release jobs never rebuild toolchains from
# scratch.
#
# Triggers:
#   - Push to main when docker/ changes  (path filter = free git diff check)
#   - Manual dispatch with optional force_rebuild flag
#
# Selectivity:
#   - base.Dockerfile changed         -> rebuild everything (base is parent)
#   - dev/cpu.Dockerfile changed      -> rebuild cpu + cpu-dependents (rpi, riscv64)
#   - dev/cuda.Dockerfile changed     -> rebuild cuda + jetson
#   - dev/<x>.Dockerfile changed      -> rebuild only that image
#   - toolchain/<x>.Dockerfile changed -> rebuild any dev image that COPY-froms it
#   - No relevant Dockerfile changed  -> each image is pulled from registry
#
# Toolchain images (vernier.toolchain.*) are NOT pushed -- they are transient
# layers consumed via COPY --from by the dev images that need them. They are
# rebuilt locally whenever the dev image that depends on them is rebuilt.
#
# Images pushed (tagged :latest and :{git-sha}):
#   vernier.base
#   vernier.dev.cpu   vernier.dev.cuda   vernier.dev.jetson
#   vernier.dev.rpi   vernier.dev.riscv64
# ==============================================================================
name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - docker/**
      # base.Dockerfile bakes the rust cargo cache, the FetchContent sources, and
      # the python wheelhouse from these, so a bump must rebuild the image to
      # refresh them (offline/hermetic builds depend on the baked copies).
      - tools/rust/Cargo.lock
      - tools/rust/Cargo.toml
      - tools/py/poetry.lock
      - tools/py/pyproject.toml
      - ExternalDependencies.cmake
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild all images regardless of Dockerfile changes"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Dev Images
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      REGISTRY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Prepare environment
        run: |
          touch ~/.gitconfig
          mkdir -p ~/.ssh
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute per-image rebuild flags and export to GITHUB_ENV so each
      # subsequent step can read them as plain shell variables.
      - name: Detect changed Dockerfiles
        run: |
          FORCE="${{ github.event.inputs.force_rebuild }}"
          DIFF=$(git diff --name-only HEAD~1 HEAD -- docker/ tools/rust/Cargo.lock tools/rust/Cargo.toml tools/py/poetry.lock tools/py/pyproject.toml ExternalDependencies.cmake 2>/dev/null || echo "docker/base.Dockerfile")
          echo "Changed docker files: $DIFF"

          changed() { echo "$DIFF" | grep -qF "$1" && echo "true" || echo "false"; }

          BASE=$(changed   "base.Dockerfile")

          # base.Dockerfile COPYs and bakes from the lock/dep files and the bake
          # script (docker/scripts/), so a change to any must rebuild base (which
          # cascades to all) -- otherwise a stale cache or stale script survives.
          # The bake script is a COPY input with no edge in this name-matched
          # graph, so it is mapped onto base explicitly here.
          if echo "$DIFF" | grep -qE 'tools/rust/Cargo\.|tools/py/(poetry\.lock|pyproject\.toml)|ExternalDependencies\.cmake|docker/scripts/'; then
            BASE=true
          fi
          CPU=$(changed    "dev/cpu.Dockerfile")
          CUDA=$(changed   "dev/cuda.Dockerfile")
          JETSON=$(changed "dev/jetson.Dockerfile")
          RPI=$(changed    "dev/rpi.Dockerfile")
          RISCV64=$(changed "dev/riscv64.Dockerfile")

          TC_AARCH64=$(changed "toolchain/aarch64.Dockerfile")
          TC_RPI=$(changed     "toolchain/rpi.Dockerfile")
          TC_RISCV64=$(changed "toolchain/riscv64.Dockerfile")

          # base change cascades to everything; force_rebuild overrides all
          if [ "$FORCE" = "true" ] || [ "$BASE" = "true" ]; then
            for v in BASE CPU CUDA JETSON RPI RISCV64; do
              echo "REBUILD_${v}=true" >> "$GITHUB_ENV"
            done
            exit 0
          fi

          echo "REBUILD_BASE=false" >> "$GITHUB_ENV"

          # cpu change cascades to cpu-dependent images (rpi, riscv64 are
          # FROM vernier.dev.cpu)
          if [ "$CPU" = "true" ]; then RPI=true; RISCV64=true; fi

          # cuda change cascades to jetson (jetson is FROM vernier.dev.cuda)
          if [ "$CUDA" = "true" ]; then JETSON=true; fi

          # toolchain changes cascade to the dev images that COPY --from them.
          # aarch64 is a parent of rpi toolchain too, so it cascades to both.
          if [ "$TC_AARCH64" = "true" ]; then JETSON=true; RPI=true; fi
          if [ "$TC_RPI"     = "true" ]; then RPI=true; fi
          if [ "$TC_RISCV64" = "true" ]; then RISCV64=true; fi

          echo "REBUILD_CPU=${CPU}"         >> "$GITHUB_ENV"
          echo "REBUILD_CUDA=${CUDA}"       >> "$GITHUB_ENV"
          echo "REBUILD_JETSON=${JETSON}"   >> "$GITHUB_ENV"
          echo "REBUILD_RPI=${RPI}"         >> "$GITHUB_ENV"
          echo "REBUILD_RISCV64=${RISCV64}" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------------
      # Base image (parent of all)
      # --------------------------------------------------------------------------
      - name: vernier.base + vernier.build-base
        run: |
          if [ "$REBUILD_BASE" = "true" ]; then
            docker compose build base build-base
            for img in vernier.base vernier.build-base; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.base vernier.build-base; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi

      # --------------------------------------------------------------------------
      # CPU and CUDA dev images (both inherit from base, independent of each other)
      # --------------------------------------------------------------------------
      - name: vernier.dev.cpu + vernier.build.cpu
        run: |
          if [ "$REBUILD_CPU" = "true" ]; then
            docker compose build dev build-cpu
            for img in vernier.dev.cpu vernier.build.cpu; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.dev.cpu vernier.build.cpu; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi

      - name: vernier.dev.cuda + vernier.build.cuda
        run: |
          if [ "$REBUILD_CUDA" = "true" ]; then
            docker compose build dev-cuda build-cuda
            for img in vernier.dev.cuda vernier.build.cuda; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.dev.cuda vernier.build.cuda; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi

      # --------------------------------------------------------------------------
      # Jetson (FROM vernier.dev.cuda, COPY --from=vernier.toolchain.aarch64)
      # --------------------------------------------------------------------------
      - name: vernier.dev.jetson + vernier.build.jetson
        run: |
          if [ "$REBUILD_JETSON" = "true" ]; then
            docker compose build toolchain-aarch64
            docker compose build dev-jetson build-jetson
            for img in vernier.dev.jetson vernier.build.jetson; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.dev.jetson vernier.build.jetson; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi

      # --------------------------------------------------------------------------
      # Linux cross-compile dev images (FROM vernier.dev.cpu)
      # --------------------------------------------------------------------------
      - name: vernier.dev.rpi + vernier.build.rpi
        run: |
          if [ "$REBUILD_RPI" = "true" ]; then
            docker compose build toolchain-aarch64
            docker compose build toolchain-rpi
            docker compose build dev-rpi build-rpi
            for img in vernier.dev.rpi vernier.build.rpi; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.dev.rpi vernier.build.rpi; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi

      - name: vernier.dev.riscv64 + vernier.build.riscv64
        run: |
          if [ "$REBUILD_RISCV64" = "true" ]; then
            docker compose build toolchain-riscv64
            docker compose build dev-riscv64 build-riscv64
            for img in vernier.dev.riscv64 vernier.build.riscv64; do
              docker tag $img $REGISTRY/$img:latest
              docker tag $img $REGISTRY/$img:${{ github.sha }}
              docker push $REGISTRY/$img:latest
              docker push $REGISTRY/$img:${{ github.sha }}
            done
          else
            for img in vernier.dev.riscv64 vernier.build.riscv64; do
              docker pull $REGISTRY/$img:latest
              docker tag $REGISTRY/$img:latest $img
            done
          fi
