# ==============================================================================
# Release -- Build artifacts and publish to GitHub Releases
#
# Triggered by pushing a version tag (v*). Builds all platform artifacts
# through the full Docker pipeline and attaches them to the GitHub Release.
#
# Rehearsal: workflow_dispatch runs the identical artifact build (version taken
# from CMakeLists.txt, no tag needed) and skips only the publish step -- proving
# the release pipeline before a tag is cut.
# ==============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      REGISTRY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          touch ~/.gitconfig
          mkdir -p ~/.ssh
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the pre-built lean build tiers (the release builders inherit these,
      # not the dev shells) so the artifact build chain reuses their layers and
      # the baked hermetic caches. base is pulled too because the cross toolchains
      # build on it. Falls back to local build if any pull fails.
      - name: Pull cached build tiers
        run: |
          for img in vernier.base vernier.build-base \
                     vernier.build.cpu vernier.build.cuda vernier.build.jetson \
                     vernier.build.rpi vernier.build.riscv64; do
            docker pull $REGISTRY/$img:latest \
              && docker tag $REGISTRY/$img:latest $img || true
          done

      - name: Resolve version
        id: version
        run: |
          cmake_version=$(sed -n 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' \
            CMakeLists.txt | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Rehearsal: no tag to verify; build the tree's own version.
            echo "version=${cmake_version}" >> "$GITHUB_OUTPUT"
            echo "Rehearsal build of ${cmake_version}"
          else
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$cmake_version" != "$tag_version" ]; then
              echo "ERROR: Tag version ($tag_version) does not match CMakeLists.txt ($cmake_version)"
              exit 1
            fi
            echo "version=${tag_version}" >> "$GITHUB_OUTPUT"
            echo "Version verified: $tag_version"
          fi

      - name: Build all artifacts
        # Route the make-driven image builds through the registry-cache overlay
        # so the toolchain/tier rebuilds reuse pushed layers instead of building
        # from scratch on the fresh runner.
        env:
          DOCKER_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci-cache.yml
        run: make artifacts

      - name: List artifacts
        run: ls -la output/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: Vernier ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output/vernier-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            output/vernier-${{ steps.version.outputs.version }}-x86_64-linux-cuda.tar.gz
            output/vernier-${{ steps.version.outputs.version }}-aarch64-jetson.tar.gz
            output/vernier-${{ steps.version.outputs.version }}-aarch64-rpi.tar.gz
            output/vernier-${{ steps.version.outputs.version }}-riscv64-linux.tar.gz
            output/vernier-tools-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            output/vernier_py_tools-${{ steps.version.outputs.version }}-py3-none-any.whl
